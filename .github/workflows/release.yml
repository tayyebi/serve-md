name: release

on:
  push:
    tags: ["v*"]
  # Lets the release build be smoke-tested without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: serve-md-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: serve-md-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: serve-md-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # No musl toolchain to install: the musl targets link self-contained,
      # using the libc.a and crt objects rustup ships with them. That holds
      # only while the tree stays pure Rust — a dependency that compiles C
      # would need musl-gcc (`musl-tools`) here.
      - run: cargo build --release --target ${{ matrix.target }}

      # The whole point of the musl targets: assert it, do not assume it.
      # A binary with a NEEDED entry or a program interpreter is dynamically
      # linked and would inherit the build machine's glibc version.
      - name: Verify the Linux binary is fully static
        if: endsWith(matrix.target, 'musl')
        run: |
          bin=target/${{ matrix.target }}/release/serve-md
          file "$bin"
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "::error::binary links shared libraries"
            readelf -d "$bin"
            exit 1
          fi
          if readelf -l "$bin" 2>/dev/null | grep -q INTERP; then
            echo "::error::binary requires a dynamic loader"
            exit 1
          fi
          echo "OK: no shared libraries, no dynamic loader"

      - name: Stage binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/serve-md${{ endsWith(matrix.target, 'msvc') && '.exe' || '' }} ${{ matrix.artifact }}

      # So a manual dry run can be inspected without publishing anything.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
