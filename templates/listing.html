<h1>Files</h1>
{{#if empty}}
<p>No files found.</p>
{{/if}}
{{#if nonempty}}
<table>
<thead>
<tr>
<th scope="col">Name</th>
<th scope="col">Size</th>
<th scope="col">Modified</th>
</tr>
</thead>
<tbody>
{{#for file}}
<tr>
<td><a href="/{{link}}">{{name}}</a></td>
<td>{{size}}</td>
<td>{{mtime}}</td>
</tr>
{{/for}}
</tbody>
</table>
{{/if}}
