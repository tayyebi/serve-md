<h1>Markdown files</h1>
<p>Serving <code>{{dir}}</code></p>
{{#if empty}}
<p>No <code>.md</code> files found.</p>
{{/if}}
{{#if nonempty}}
<table>
<caption>Files in {{dir}}</caption>
<thead>
<tr>
<th scope="col">Name</th>
<th scope="col">Size</th>
<th scope="col">Modified</th>
</tr>
</thead>
<tbody>
{{#for file}}
<tr>
<td><a href="/view/{{link}}">{{name}}</a></td>
<td>{{size}}</td>
<td>{{mtime}}</td>
</tr>
{{/for}}
</tbody>
</table>
{{/if}}
