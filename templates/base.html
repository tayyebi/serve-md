<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{title}}</title>
<style>
{{raw:style}}
</style>
</head>
<body>

    <a class="brand" href="/">serve-md</a>
